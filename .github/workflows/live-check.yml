name: Verificar jogo oficial no Chrome

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - '.github/workflows/live-check.yml'

permissions:
  contents: read

jobs:
  verify-live:
    name: Jogar as cinco fases no site real
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preparar Google Chrome
        run: |
          npm ci --ignore-scripts
          node scripts/ignore_deps.cjs
          npx playwright install --with-deps chromium
          if ! command -v google-chrome > /dev/null; then
            npx playwright install --with-deps chrome
          fi
          google-chrome --version
          echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Confirmar Guilherme, judo, Snoopy e as cinco fases no site real
        env:
          WEB_TEST_URL: https://rafaelsantanna13.github.io/Rafinha2D/?check=${{ github.sha }}
          WEB_SCREENSHOTS: build/live/screenshots
        run: npm run test:web
      - name: Guardar capturas e resultado do site oficial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-live-chrome-evidence
          path: build/live/screenshots/
