name: Aventura - testes e preview isolado

on:
  push:
    branches: [feature/castle-dog-rescue-adventure]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Same lock as the existing official workflow: one Pages deployment at a time.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Godot 4.5.2 Standard e templates Web oficiais
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y unzip libfontconfig1
          base="https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable"
          curl --fail --location --retry 3 -o /tmp/godot.zip "$base/Godot_v4.5.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.5.2-stable_linux.x86_64
          sudo mv /tmp/Godot_v4.5.2-stable_linux.x86_64 /usr/local/bin/godot
          curl --fail --location --retry 3 -o /tmp/templates.tpz "$base/Godot_v4.5.2-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.2.stable"
          unzip -q /tmp/templates.tpz 'templates/web*' -d /tmp/export-templates
          cp /tmp/export-templates/templates/web* "$HOME/.local/share/godot/export_templates/4.5.2.stable/"
          godot --version
      - name: Verificar fontes e importar recursos
        run: |
          python3 scripts/validate_project.py
          godot --headless --path . --editor --import --quit 2>&1 | tee import.log
          ! grep -E 'SCRIPT ERROR|ERROR:' import.log
      - name: Testes de jogo no Godot e isolamento da publicacao
        run: |
          set -o pipefail
          godot --headless --path . --fixed-fps 60 --script tests/run_adventure.gd -- --adventure-tests 2>&1 | tee godot-tests.log
          ! grep -E 'SCRIPT ERROR|ERROR:' godot-tests.log
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Exportar o jogo experimental
        run: |
          mkdir -p build/preview
          godot --headless --path . --export-release Web build/preview/index.html 2>&1 | tee export.log
          ! grep -E 'SCRIPT ERROR|ERROR:' export.log
          python3 scripts/validate_project.py build/preview
      - name: Instalar navegador de teste
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Jogar os tres castelos no navegador com teclado
        env:
          WEB_TEST_URL: http://127.0.0.1:8765/
        run: |
          python3 -m http.server 8765 --directory build/preview > /tmp/web-server.log 2>&1 &
          npm run test:web
      - name: Copiar a publicacao oficial sem alterar seus arquivos
        if: github.event_name != 'pull_request'
        run: python3 scripts/compose_pages.py --source-sha '${{ github.sha }}'
      - name: Confirmar que a versao oficial continua identica
        if: github.event_name != 'pull_request'
        run: python3 scripts/compose_pages.py --verify --check-remote
      - name: Guardar evidencias de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adventure-test-evidence
          path: |
            import.log
            godot-tests.log
            export.log
            build/preview/screenshots/
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify-build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}teste/
    steps:
      - name: Publicar raiz oficial preservada e /teste/ experimental
        id: deploy
        uses: actions/deploy-pages@v4
