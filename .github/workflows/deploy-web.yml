name: Publicar Rafinha2D Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Instalar Godot 4.5.2 e templates oficiais
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y unzip libfontconfig1
          base="https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable"
          curl --fail --location --retry 3 -o /tmp/godot.zip "$base/Godot_v4.5.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.5.2-stable_linux.x86_64
          sudo mv /tmp/Godot_v4.5.2-stable_linux.x86_64 /usr/local/bin/godot
          curl --fail --location --retry 3 -o /tmp/templates.tpz "$base/Godot_v4.5.2-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.2.stable"
          unzip -q /tmp/templates.tpz 'templates/web*' -d /tmp/export-templates
          cp /tmp/export-templates/templates/web* "$HOME/.local/share/godot/export_templates/4.5.2.stable/"
          godot --version
      - name: Importar e verificar o jogo antes de publicar
        run: |
          set -o pipefail
          python3 scripts/validate_project.py
          godot --headless --path . --editor --import --quit 2>&1 | tee import.log
          ! grep -E 'SCRIPT ERROR|ERROR:' import.log
          timeout 120 godot --headless --path . --fixed-fps 60 --script tests/run_adventure.gd -- --adventure-tests 2>&1 | tee godot-tests.log
          ! grep -E 'SCRIPT ERROR|ERROR:' godot-tests.log
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Exportar para Web
        run: |
          set -o pipefail
          mkdir -p public
          godot --headless --path . --export-release Web public/index.html 2>&1 | tee export.log
          ! grep -E 'SCRIPT ERROR|ERROR:' export.log
          python3 scripts/validate_project.py public
          touch public/.nojekyll
      - name: Guardar verificacoes da publicacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-build-evidence
          path: |
            import.log
            godot-tests.log
            export.log
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos da pagina
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    name: Jogar a versao oficial publicada no Chrome
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preparar Google Chrome
        run: |
          npm ci --ignore-scripts
          node scripts/ignore_deps.cjs
          npx playwright install --with-deps chromium
          if ! command -v google-chrome > /dev/null; then
            npx playwright install --with-deps chrome
          fi
          google-chrome --version
          echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Confirmar Guilherme, judo, Snoopy e as cinco fases no site real
        env:
          WEB_TEST_URL: ${{ needs.deploy.outputs.page_url }}?release=${{ github.sha }}
          WEB_SCREENSHOTS: build/live/screenshots
        run: npm run test:web
      - name: Guardar capturas e resultado do site oficial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-live-chrome-evidence
          path: build/live/screenshots/
